# CI do FashionAI: nada entra no main (nem vai para o Railway/Vercel) sem build, testes e varredura de segredos.
# Railway: no serviço "api", Settings → Deploy → "Wait for CI" liga o deploy a este workflow.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catálogo (Python · ingestão e recuperação de conexão)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/catalog/requirements-photo-tests.txt
      - run: python -m unittest discover -s scripts/catalog/tests

  backend:
    name: API (Java 21 · mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build e testes
        run: mvn -B -ntp verify

  frontend:
    name: Front (typecheck · vitest · build · audit)
    # Playwright 1.55.1 supports Ubuntu 24.04; ubuntu-latest now resolves to unsupported 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (vitest)
        run: npm test
      - name: Build de produção (inclui as checagens de i18n)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          DEV_GATE_ENABLED: "false"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Auditoria de telas (Chromium · WCAG · overflow · CLS)
        env:
          DEV_GATE_ENABLED: "false"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          UI_AUDIT_OUTPUT: /tmp/fashionai-ux-audit
          NODE_PATH: /tmp/fashionai-ux-tools/node_modules
        run: |
          npm install --prefix /tmp/fashionai-ux-tools --no-audit --no-fund playwright@1.55.1 @axe-core/playwright@4.10.2
          /tmp/fashionai-ux-tools/node_modules/.bin/playwright install --with-deps chromium
          npm start > /tmp/fashionai-ui-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null; then break; fi
            sleep 1
          done
          node scripts/ux/browser-audit.cjs
      - name: Lighthouse CI (login · emulação móvel)
        run: |
          npm install --prefix /tmp/fashionai-lighthouse-tools --no-audit --no-fund @lhci/cli@0.15.1
          /tmp/fashionai-lighthouse-tools/node_modules/.bin/lhci autorun
      - name: Relatório Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashionai-lighthouse
          path: /tmp/fashionai-lighthouse
          if-no-files-found: ignore
      - name: Capturas e relatório da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashionai-ux-audit
          path: /tmp/fashionai-ux-audit
          if-no-files-found: ignore
      - name: Dependências de produção sem vulnerabilidade alta ou crítica
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (histórico inteiro)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
