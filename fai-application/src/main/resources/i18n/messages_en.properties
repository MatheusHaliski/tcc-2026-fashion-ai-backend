photoAcceptance.recusada=Photo rejected: {0}
photoAcceptance.fundo=the piece could not be separated from the background. Lay the piece flat on a plain background of a different color.
photoAcceptance.inteira=the piece is cut off by the edge of the photo ({0}). Move the camera back until the whole piece fits in the frame, with some background around it.
photoAcceptance.lado.top=top
photoAcceptance.lado.bottom=bottom
photoAcceptance.lado.left=left
photoAcceptance.lado.right=right
photoAcceptance.pequena=the piece fills only {0}% of the photo. Move closer so it fills most of the frame, without cutting the edges.
photoAcceptance.resolucao=the piece has too few pixels ({0} px). Use the main camera, without digital zoom, and shoot closer.
photoAcceptance.inclinada=the piece is tilted {0}°. Line the piece up straight with the edges of the photo.
photoAcceptance.frontal=the piece is not facing the camera (symmetry {0}%). Shoot with the camera at 90°, right above the flat piece, with no angle and no folds.
photoAcceptance.varias=there are {0} separate objects in the photo. Send one piece per photo (shoes, earrings, gloves and socks may come in pairs).
photoAcceptance.desfocada=the photo is shaky or out of focus. Steady the phone and tap the piece to focus.
photoAcceptance.exposicao=the photo is too dark or overexposed. Use soft natural light, no flash and no backlight.
photoAcceptance.tipo=the photo does not look like {0} (the analysis saw: {1}). Check the chosen type or send another photo.
photoAcceptance.formato=the shape of the piece does not resemble any {0} subtype. Lay the piece flat and shoot all of it, from the front.
photoAcceptance.nao_roupa=the image does not look like a piece of clothing, footwear or accessory.
photoAcceptance.ia_cortada=the analysis saw the piece cut off or incomplete. Frame the whole piece, with background around it.
photoAcceptance.ia_angulo=the analysis saw the piece shot at an angle, from the side or folded. Shoot with the camera at 90°, above the flat piece.
