# Fashion AI — configuração da API. Todo valor sensível vem de variável de ambiente (ver .env.example).
spring:
  application:
    name: fashion-ai-api
  datasource:
    # TLS pelo sslMode do Connector/J: PREFERRED (padrão) usa TLS sempre que o servidor oferece — e com TLS o
    # caching_sha2_password autentica sem allowPublicKeyRetrieval. Produção: MYSQL_SSL_MODE=REQUIRED.
    # MYSQL_USE_SSL (legado) ainda vale: true -> REQUIRED (MysqlSslModeEnvironmentPostProcessor).
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fashionai}?sslMode=${MYSQL_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:fashionai}
    password: ${MYSQL_PASSWORD}             # obrigatória, sem valor padrão: sem ela a API não sobe (local: .env do .env.example)
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none          # o schema é 100% Flyway (V1..Vn)
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_uuid_jdbc_type: CHAR   # ids UUID gravados como CHAR(36), como nas migrações
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 80MB
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        write-dates-as-timestamps: false   # Jackson 3 (Boot 4): DateTimeFeature; datas sempre em ISO-8601
    deserialization:
      # Jackson 3 passou a recusar null em campo primitivo (400 "JSON inválido"); o front manda null em checkbox e
      # número não preenchidos, e no Jackson 2 isso virava false/0. Contrato fixado no JsonContractTest (fai-bootstrap).
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false    # cliente antigo/novo com campo a mais não quebra (era o padrão do Boot 3)
  web:
    error:
      include-stacktrace: never            # Boot 4: era server.error.include-stacktrace
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}      # usuário ACL (infra/railway/redis); vazio = usuário "default" com requirepass
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}   # Upstash, Redis Cloud e a maioria dos provedores gerenciados exigem TLS
      timeout: ${REDIS_TIMEOUT_MS:3000}ms
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost}
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_LOCAL_DATACENTER:datacenter1}
    keyspace-name: ${CASSANDRA_KEYSPACE:fashionai_feed}
    # usuário/senha ficam em fashionai.cassandra: aqui, vazios, o Spring Boot recusaria Cassandra sem autenticação
  autoconfigure:
    # Cassandra só é ligado pelo perfil "cassandra"; sem ele o driver nem tenta conectar.
    # Nomes do Spring Boot 4 (módulos spring-boot-cassandra / spring-boot-data-cassandra). Atenção: excluir uma classe que
    # não existe é ignorado em silêncio — o AutoConfigurationExclusionsTest (fai-bootstrap) confere cada nome.
    exclude:
      - org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraRepositoriesAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveRepositoriesAutoConfiguration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # atrás de proxy/CDN (Railway, Render, Vercel)

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_EXPOSURE:health,info,metrics,prometheus}   # métricas e prometheus exigem papel ADMIN
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
    cassandra:
      enabled: ${CASSANDRA_ENABLED:false}
  metrics:
    tags:
      application: fashion-ai-api

springdoc:
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}   # produção: API_DOCS_ENABLED=false
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    br.com.fashionai: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{30} - %msg%n"

fashionai:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}        # usado nas URLs de mídia local
  frontend-url: ${FRONTEND_URL:http://localhost:3000}      # links de e-mail (confirmar e-mail, redefinir senha)
  admin:                                                   # conta de administração criada/promovida na subida (AdminBootstrap)
    email: ${FAI_ADMIN_EMAIL:}
    password: ${FAI_ADMIN_PASSWORD:}                         # só na criação; mínimo 12 caracteres
    username: ${FAI_ADMIN_USERNAME:admin}
    display-name: ${FAI_ADMIN_DISPLAY_NAME:Administração Fashion AI}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Gate de desenvolvedor (antes do lançamento): cabeçalho X-Dev-Gate (token curto de API, por pessoa) assinado pelo
  # /gate do frontend com o mesmo segredo (mínimo de 32 caracteres), ou JWT do Cloudflare Access (mode: cloudflare)
  dev-gate:
    enabled: ${DEV_GATE_ENABLED:false}
    mode: ${DEV_GATE_MODE:builtin}                         # builtin | cloudflare
    secret: ${DEV_GATE_SECRET:}
    user: ${DEV_GATE_USER:matheushaliskitcc20233}
    allowed-emails: ${DEV_GATE_ALLOWED_EMAILS:}            # a mesma lista da Vercel: revogação por pessoa também na API
    accept-legacy: ${DEV_GATE_ACCEPT_LEGACY:true}          # transição: aceita o token antigo (v1); false depois de DEV_GATE_API_TOKEN=v2
    cloudflare:
      team-domain: ${CF_ACCESS_TEAM_DOMAIN:}               # ex.: fashionai.cloudflareaccess.com
      aud: ${CF_ACCESS_AUD:}                               # "Application Audience (AUD) Tag" da aplicação no Access
  jwt:
    issuer: ${JWT_ISSUER:fashionai}
    audience: ${JWT_AUDIENCE:fashionai-api}              # claim aud exigido pela API
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    require-keys: ${JWT_REQUIRE_KEYS:false}        # produção: true (sem as chaves a aplicação não sobe)
  security:
    auth-rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}     # limite por IP em login, cadastro e redefinição de senha
    # IP do cliente (ClientIpResolver): 1) X-Fai-Client-Ip assinado pelo BFF com este segredo; 2) cabeçalho da borda; 3) conexão
    edge-proxy-secret: ${EDGE_PROXY_SECRET:}       # vazio = ignora o cabeçalho assinado do BFF Next.js
    client-ip-header: ${CLIENT_IP_HEADER:X-Real-IP} # Railway sobrescreve X-Real-IP com o IP real; vazio desliga
    image-max-pixels: ${IMAGE_MAX_PIXELS:40000000}  # teto de decodificação (bomba de descompressão); também limitado pelo heap
    image-max-side: ${IMAGE_MAX_SIDE:12000}         # px por lado
  assets:
    public-dir: ${ASSETS_PUBLIC_DIR:public}                # /public do repositório (chrome, aura, material, ícones)
  storage:
    type: ${STORAGE_TYPE:local}                            # local | s3
    local-dir: ${STORAGE_LOCAL_DIR:./data/media}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:fashionai-media}
      access-key: ${S3_ACCESS_KEY_ID:}
      secret-key: ${S3_SECRET_ACCESS_KEY:}
      path-style: ${S3_PATH_STYLE:}                        # vazio = path-style só com S3_ENDPOINT (MinIO); Railway: false
      serve-through-api: ${S3_SERVE_THROUGH_API:false}     # bucket privado (Railway): a API entrega /media/** lendo do bucket
  redis:
    enabled: ${REDIS_ENABLED:false}
  cassandra:
    enabled: ${CASSANDRA_ENABLED:false}
    username: ${CASSANDRA_USERNAME:}                       # vazio = sem autenticação (contêiner na rede privada)
    password: ${CASSANDRA_PASSWORD:}
    create-keyspace: ${CASSANDRA_CREATE_KEYSPACE:false}    # Cassandra próprio sem autenticação: cria o keyspace na subida
    replication-factor: ${CASSANDRA_REPLICATION_FACTOR:1}  # (endurecido, infra/railway/cassandra: o keyspace já vem criado -> false)
    resolve-contact-points: ${CASSANDRA_RESOLVE_CONTACT_POINTS:false}   # false: resolve o nome a cada reconexão (IP muda a cada deploy)
    ssl:                                                   # TLS cliente -> nó
      enabled: ${CASSANDRA_SSL:false}
      ca-cert-pem: ${CASSANDRA_CA_CERT_PEM:}               # certificado do nó/CA em PEM; vazio = truststore da JVM
      hostname-validation: ${CASSANDRA_SSL_HOSTNAME_VALIDATION:false}   # o driver conecta por IP; a CA fixada já basta
    secure-connect-bundle:                                 # DataStax Astra DB (substitui contact-points/datacenter)
      path: ${CASSANDRA_SECURE_BUNDLE_PATH:}
      base64: ${CASSANDRA_SECURE_BUNDLE_BASE64:}
    timeline-ttl-days: 90
    notification-ttl-days: 30
  opensearch:
    enabled: ${OPENSEARCH_ENABLED:false}
    url: ${OPENSEARCH_URL:http://localhost:9200}           # com o plugin de segurança: https://<host>:9200
    username: ${OPENSEARCH_USERNAME:}                      # usuário da aplicação (só índices fai-*), nunca o admin
    password: ${OPENSEARCH_PASSWORD:}
    ca-cert-pem: ${OPENSEARCH_CA_CERT_PEM:}                # CA do cluster (PEM): só certificados dela são aceitos
    tls-verify-hostname: ${OPENSEARCH_TLS_VERIFY_HOSTNAME:true}
    tls-insecure: ${OPENSEARCH_TLS_INSECURE:false}         # true aceita qualquer certificado (só rede privada; loga WARN)
    index-prefix: fai-
  backup:                                                  # backup do MySQL (AdminService -> mysqldump -> storage em restricted/backups/)
    cron: ${BACKUP_CRON:0 0 3 * * *}                       # diário às 3 h (America/Sao_Paulo); "-" desliga o job agendado
    retention-count: ${BACKUP_RETENTION_COUNT:14}          # mantém os N backups mais recentes; os antigos saem do storage
    user: ${MYSQL_BACKUP_USER:${MYSQL_USER:fashionai}}     # usuário só de leitura para o dump (infra/railway/mysql)
    password: ${MYSQL_BACKUP_PASSWORD:${MYSQL_PASSWORD:}}  # sem senha padrão: vazia, o backup falha com o motivo
    ssl-mode: ${MYSQL_SSL_MODE:PREFERRED}                  # o mesmo modo TLS da conexão JDBC
    timeout-minutes: ${BACKUP_TIMEOUT_MINUTES:10}
    mysqldump-command: ${BACKUP_MYSQLDUMP_COMMAND:mysqldump}
  email:
    provider: ${EMAIL_PROVIDER:log}                        # log | resend
    resend-api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM_EMAIL:nao-responda@fashionai.app}
    log-bodies: ${EMAIL_LOG_BODIES:false}                  # provider=log: corpo (códigos, links de senha) no log só em dev local
  weather:
    enabled: ${WEATHER_ENABLED:true}                       # Open-Meteo (gratuito, sem chave)
  ai:
    remote-enabled: ${AI_REMOTE_ENABLED:true}              # false = só motores locais (demonstração offline)
    timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:30}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    google-ai-api-key: ${GOOGLE_AI_API_KEY:}
    gemini-image-model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}   # RF4 · cópia da peça por IA (imagem → imagem)
    replicate-api-token: ${REPLICATE_API_TOKEN:${REPLICATE_API_KEY:}}
    replicate-edit-model: ${REPLICATE_EDIT_MODEL:black-forest-labs/flux-kontext-pro}   # RF4 · reserva da cópia da peça por IA
    fashn-api-key: ${FASHN_API_KEY:}
    meshy-api-key: ${MESHY_API_KEY:}
    stability-api-key: ${STABILITY_API_KEY:}               # RF16 (Stable Fast 3D) e RF4 estúdio (upscale)
    photoroom-api-key: ${PHOTOROOM_API_KEY:}               # RF4 estúdio (fundo + reiluminação + sombra por IA)
    remove-bg-api-key: ${REMOVE_BG_API_KEY:${REMBG_API_KEY:}}
    rembg-url: ${REMBG_URL:}
    google-vision-api-key: ${GOOGLE_VISION_API_KEY:}       # moderação de fotos enviadas (SafeSearch); vazio = segmentação local + revisão humana
    daily-budget-usd: ${AI_DAILY_BUDGET_USD:5.00}          # teto global de gasto com IA externa por dia UTC (0 = sem teto)
    user-daily-budget-usd: ${AI_USER_DAILY_BUDGET_USD:0.50} # teto por usuário por dia UTC (0 = sem teto)
  moderation:
    uploads-enabled: ${UPLOAD_MODERATION_ENABLED:true}    # confere nudez nas fotos enviadas antes de gravar (docs/seguranca/moderacao-de-imagens.md)
  features:
    rf16-3d: ${FEATURE_RF16_3D:true}                       # sem chave de 3D, o gerador local em relevo assume
    rf16-3d-timeout-minutes: ${RF16_3D_TIMEOUT_MINUTES:10}

---
spring:
  config:
    activate:
      on-profile: cassandra
  autoconfigure:
    exclude:
fashionai:
  cassandra:
    enabled: true
management:
  health:
    cassandra:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: redis
fashionai:
  redis:
    enabled: true
management:
  health:
    redis:
      enabled: true
