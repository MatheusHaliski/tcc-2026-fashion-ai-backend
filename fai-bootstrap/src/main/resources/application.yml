# Fashion AI — configuração da API. Todo valor sensível vem de variável de ambiente (ver .env.example).
spring:
  application:
    name: fashion-ai-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fashionai}?useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:fashionai}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none          # o schema é 100% Flyway (V1..Vn)
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_uuid_jdbc_type: CHAR   # ids UUID gravados como CHAR(36), como nas migrações
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 80MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}   # Upstash, Redis Cloud e a maioria dos provedores gerenciados exigem TLS
      timeout: ${REDIS_TIMEOUT_MS:3000}ms
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost}
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_LOCAL_DATACENTER:datacenter1}
    keyspace-name: ${CASSANDRA_KEYSPACE:fashionai_feed}
    # usuário/senha ficam em fashionai.cassandra: aqui, vazios, o Spring Boot recusaria Cassandra sem autenticação
  autoconfigure:
    # Cassandra só é ligado pelo perfil "cassandra"; sem ele o driver nem tenta conectar.
    exclude:
      - org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraReactiveRepositoriesAutoConfiguration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # atrás de proxy/CDN (Railway, Render, Vercel)
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_EXPOSURE:health,info,metrics,prometheus}   # métricas e prometheus exigem papel ADMIN
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
    cassandra:
      enabled: ${CASSANDRA_ENABLED:false}
  metrics:
    tags:
      application: fashion-ai-api

springdoc:
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}   # produção: API_DOCS_ENABLED=false
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    br.com.fashionai: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{30} - %msg%n"

fashionai:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}        # usado nas URLs de mídia local
  frontend-url: ${FRONTEND_URL:http://localhost:3000}      # links de e-mail (confirmar e-mail, redefinir senha)
  admin:                                                   # conta de administração criada/promovida na subida (AdminBootstrap)
    email: ${FAI_ADMIN_EMAIL:}
    password: ${FAI_ADMIN_PASSWORD:}                         # só na criação; mínimo 12 caracteres
    username: ${FAI_ADMIN_USERNAME:admin}
    display-name: ${FAI_ADMIN_DISPLAY_NAME:Administração Fashion AI}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Gate de desenvolvedor (antes do lançamento): cabeçalho X-Dev-Gate assinado pelo /gate do frontend com o mesmo segredo
  dev-gate:
    enabled: ${DEV_GATE_ENABLED:false}
    secret: ${DEV_GATE_SECRET:}
    user: ${DEV_GATE_USER:matheushaliskitcc20233}
  jwt:
    issuer: ${JWT_ISSUER:fashionai}
    audience: ${JWT_AUDIENCE:fashionai-api}              # claim aud exigido pela API
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    require-keys: ${JWT_REQUIRE_KEYS:false}        # produção: true (sem as chaves a aplicação não sobe)
  security:
    auth-rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}     # limite por IP em login, cadastro e redefinição de senha
    # IP do cliente (ClientIpResolver): 1) X-Fai-Client-Ip assinado pelo BFF com este segredo; 2) cabeçalho da borda; 3) conexão
    edge-proxy-secret: ${EDGE_PROXY_SECRET:}       # vazio = ignora o cabeçalho assinado do BFF Next.js
    client-ip-header: ${CLIENT_IP_HEADER:X-Real-IP} # Railway sobrescreve X-Real-IP com o IP real; vazio desliga
    image-max-pixels: ${IMAGE_MAX_PIXELS:40000000}  # teto de decodificação (bomba de descompressão); também limitado pelo heap
    image-max-side: ${IMAGE_MAX_SIDE:12000}         # px por lado
  assets:
    public-dir: ${ASSETS_PUBLIC_DIR:public}                # /public do repositório (chrome, aura, material, ícones)
  storage:
    type: ${STORAGE_TYPE:local}                            # local | s3
    local-dir: ${STORAGE_LOCAL_DIR:./data/media}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:fashionai-media}
      access-key: ${S3_ACCESS_KEY_ID:}
      secret-key: ${S3_SECRET_ACCESS_KEY:}
      path-style: ${S3_PATH_STYLE:}                        # vazio = path-style só com S3_ENDPOINT (MinIO); Railway: false
      serve-through-api: ${S3_SERVE_THROUGH_API:false}     # bucket privado (Railway): a API entrega /media/** lendo do bucket
  redis:
    enabled: ${REDIS_ENABLED:false}
  cassandra:
    enabled: ${CASSANDRA_ENABLED:false}
    username: ${CASSANDRA_USERNAME:}                       # vazio = sem autenticação (contêiner na rede privada)
    password: ${CASSANDRA_PASSWORD:}
    create-keyspace: ${CASSANDRA_CREATE_KEYSPACE:false}    # Cassandra próprio (Railway/Docker): cria o keyspace na subida
    replication-factor: ${CASSANDRA_REPLICATION_FACTOR:1}
    secure-connect-bundle:                                 # DataStax Astra DB (substitui contact-points/datacenter)
      path: ${CASSANDRA_SECURE_BUNDLE_PATH:}
      base64: ${CASSANDRA_SECURE_BUNDLE_BASE64:}
    timeline-ttl-days: 90
    notification-ttl-days: 30
  opensearch:
    enabled: ${OPENSEARCH_ENABLED:false}
    url: ${OPENSEARCH_URL:http://localhost:9200}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    index-prefix: fai-
  email:
    provider: ${EMAIL_PROVIDER:log}                        # log | resend
    resend-api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM_EMAIL:nao-responda@fashionai.app}
    log-bodies: ${EMAIL_LOG_BODIES:false}                  # provider=log: corpo (códigos, links de senha) no log só em dev local
  weather:
    enabled: ${WEATHER_ENABLED:true}                       # Open-Meteo (gratuito, sem chave)
  ai:
    remote-enabled: ${AI_REMOTE_ENABLED:true}              # false = só motores locais (demonstração offline)
    timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:30}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    google-ai-api-key: ${GOOGLE_AI_API_KEY:}
    replicate-api-token: ${REPLICATE_API_TOKEN:${REPLICATE_API_KEY:}}
    fashn-api-key: ${FASHN_API_KEY:}
    meshy-api-key: ${MESHY_API_KEY:}
    stability-api-key: ${STABILITY_API_KEY:}               # RF16 (Stable Fast 3D) e RF4 estúdio (upscale)
    photoroom-api-key: ${PHOTOROOM_API_KEY:}               # RF4 estúdio (fundo + reiluminação + sombra por IA)
    remove-bg-api-key: ${REMOVE_BG_API_KEY:${REMBG_API_KEY:}}
    rembg-url: ${REMBG_URL:}
    google-vision-api-key: ${GOOGLE_VISION_API_KEY:}       # moderação de fotos enviadas (SafeSearch); vazio = segmentação local + revisão humana
  moderation:
    uploads-enabled: ${UPLOAD_MODERATION_ENABLED:true}    # confere nudez nas fotos enviadas antes de gravar (docs/seguranca/moderacao-de-imagens.md)
  features:
    rf16-3d: ${FEATURE_RF16_3D:true}                       # sem chave de 3D, o gerador local em relevo assume
    rf16-3d-timeout-minutes: ${RF16_3D_TIMEOUT_MINUTES:10}

---
spring:
  config:
    activate:
      on-profile: cassandra
  autoconfigure:
    exclude:
fashionai:
  cassandra:
    enabled: true
management:
  health:
    cassandra:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: redis
fashionai:
  redis:
    enabled: true
management:
  health:
    redis:
      enabled: true
