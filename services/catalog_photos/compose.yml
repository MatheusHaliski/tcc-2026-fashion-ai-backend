# Dedicated background service; uses the same MySQL/storage configuration as the API.
services:
  catalog-photos:
    build:
      context: ../..
      dockerfile: services/catalog_photos/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      CATALOG_PHOTO_MODEL_CACHE: /home/worker/.cache/fashionai/catalog
      CATALOG_PHOTO_DEVICE: cpu
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    cpus: 2
    mem_limit: 6g
    volumes:
      - models:/home/worker/.cache/fashionai/catalog
      - audit:/app/work
volumes:
  models:
  audit:
