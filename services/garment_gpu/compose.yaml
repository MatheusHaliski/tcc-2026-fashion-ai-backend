# FashionAI garment GPU stack (Linux + NVIDIA driver + Docker Engine + NVIDIA Container Toolkit).
#   docker compose up --build -d                                   # Fase 1: API + Redis + RustFS (S3) + worker de segmentação
#   docker compose --profile reconstruct up --build -d             # Fase 2: + worker generativo (Qwen-Image-Edit)
#   docker compose --profile monitoring up -d                      # Prometheus + Grafana + NVIDIA DCGM exporter
#   docker compose --profile edge up -d                            # Caddy com HTTPS automático na frente da API
# Workers extras em OUTRAS máquinas GPU: compose.worker.yaml (Fase 3).
name: fai-garment-gpu

x-common: &common
  env_file: .env
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-backend-env: &backend-env
  REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379/0
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}

x-depends: &depends
  redis: { condition: service_healthy }
  storage: { condition: service_healthy }

services:
  api:
    <<: *common
    build: { context: ., dockerfile: Dockerfile.api }
    image: fai-garment-api:local
    environment: *backend-env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on: *depends
    read_only: true
    tmpfs: [/tmp]

  gpu-segment:
    <<: *common
    build: { context: ., dockerfile: Dockerfile.worker, args: { STAGE: segment } }
    image: fai-garment-segment:local
    environment:
      <<: *backend-env
      WORKER_STAGE: segment
    volumes: ["hf-models:/models"]
    shm_size: "2gb"
    depends_on: *depends
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["${SEGMENT_GPU:-0}"], capabilities: [gpu] }]

  gpu-reconstruct:
    <<: *common
    profiles: [reconstruct]
    build: { context: ., dockerfile: Dockerfile.worker, args: { STAGE: reconstruct } }
    image: fai-garment-reconstruct:local
    environment:
      <<: *backend-env
      WORKER_STAGE: reconstruct
    volumes: ["hf-models:/models", "./loras:/loras:ro"]
    shm_size: "8gb"
    depends_on: *depends
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["${RECONSTRUCT_GPU:-0}"], capabilities: [gpu] }]

  redis:
    <<: *common
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    # Rede privada (WireGuard/Tailscale) para workers remotos: PRIVATE_BIND=10.8.0.1. Nunca 0.0.0.0 na internet.
    ports: ["${PRIVATE_BIND:-127.0.0.1}:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      retries: 5

  storage:
    <<: *common
    # RustFS (Apache-2.0, compatível com S3). As imagens minio/minio e minio/mc saíram do Docker Hub; qualquer S3
    # (AWS, R2, GCS interoperável) também serve: aponte S3_ENDPOINT para ele e remova este serviço.
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://127.0.0.1:9001
    ports: ["${PRIVATE_BIND:-127.0.0.1}:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      retries: 5

  prometheus:
    <<: *common
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro",
              "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    <<: *common
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["./deploy/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro", "grafana-data:/var/lib/grafana"]
    ports: ["127.0.0.1:3000:3000"]

  dcgm-exporter:
    <<: *common
    profiles: [monitoring]
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    cap_add: [SYS_ADMIN]
    security_opt: []
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  caddy:
    <<: *common
    profiles: [edge]
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN (DNS apontando para este servidor)}
      ALLOWED_CIDRS: ${ALLOWED_CIDRS:-0.0.0.0/0 ::/0}
    ports: ["80:80", "443:443"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [api]

volumes:
  hf-models:
  redis-data:
  storage-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
