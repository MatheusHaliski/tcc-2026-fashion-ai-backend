global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: fai-garment-api          # jobs aceitos/recusados, profundidade das filas, workers vivos
    static_configs: [{ targets: ["api:8000"] }]

  - job_name: fai-garment-workers      # duração e resultado de cada etapa, nota do QA
    static_configs:
      - targets: ["gpu-segment:9101", "gpu-reconstruct:9101"]
      # workers remotos (compose.worker.yaml) pela rede privada:
      # - targets: ["10.8.0.2:9101"]

  - job_name: nvidia-dcgm              # utilização, VRAM, temperatura e potência de cada GPU
    static_configs: [{ targets: ["dcgm-exporter:9400"] }]
